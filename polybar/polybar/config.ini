;==========================================================
;
;   To learn more about how to configure Polybar
;   go to https://github.com/jaagr/polybar
;
;   The README contains alot of information
;
;=====================================================
; Windows XP "Luna" Theme for Polybar
; =====================================================================
 [colors]
; Core Luna Theme Colors
base_blue        = #0055EA
top_bevel        = #3D91FF
start_green      = #388E3C
tray_blue        = #0972DA
active_task      = #0940A1
inactive_task    = #1C69E2
flash_orange     = #FF7B00
transparent_blue = #4D0055EA

; Faint white glass border edge
border_ghost     = #22FFFFFF
; Neon violet primary accent
violet_accent    = #9D4EDD
; Ice cyan secondary accent
cyan_accent      = #48CAE4
; High-contrast readable white
text_white       = #EDF2F4
; Dimmed slate text
text_muted       = #8A99AD
; Alert red
alert_red        = #FF4D6D

; Deep midnight purple-black background (~70% opacity)
bg_glass         = #B30F051D
; Translucent violet module fill
bg_card          = #4D240046
; Primary neon violet border edge
border_glow      = #9D4EDD
; Secondary neon cyan border edge
border_cyan      = #48CAE4

[bar/main]
bottom = false
width = 98%
height = 20pt
offset-x = 1%
offset-y = 5pt
;radius = 0
radius = 10.0

background = ${colors.bg_glass}
foreground = ${colors.text_white}

padding-left = 1
padding-right = 1

; Glowing dual-line border effect
;border-bottom-size = 2pt
;border-bottom-color = ${colors.border_glow}
;border-top-size = 1pt
;border-top-color = ${colors.border_cyan}
border-size = 2pt
border-color = ${colors.border_glow}

; Fonts (Nerd Font prioritized first for proper icon glyph matching)
font-0 = "VictorMono Nerd Font:style=Medium Italic:size=9;3"
font-1 = "Tahoma:size=10:weight=bold;2"
font-2 = "DejaVu Sans:size=10;2"
font-3 = "FontAwesome:pixelsize=11;2"

; Layout structure
modules-left = i3 date-left
modules-center = window-title media-prev media-play media-next media-info
modules-right = date ip-eth memory cpu volume-percent year-progress poweroff

override-redirect = true
wm-restack = i3
cursor-click = pointer

; =====================================================================
; Modules: Left & Center
; =====================================================================

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = false

; Active Workspace
label-focused = "  %name%  "
label-focused-background = ${colors.border_glow}
label-focused-foreground = #0F051D
label-focused-padding = 1

; Inactive Workspaces
label-unfocused = "  %name%  "
label-unfocused-background = ${colors.bg_card}
label-unfocused-foreground = ${colors.text_muted}
label-unfocused-padding = 1

; Urgent Workspaces
label-urgent = "  %name%  "
label-urgent-background = ${colors.alert_red}
label-urgent-foreground = ${colors.text_white}
label-urgent-padding = 1

label-separator = " "
label-separator-background = ${colors.transparent_blue}

[module/year-progress]
type = custom/script
exec = ~/.config/polybar/scripts/year-progress.sh
interval = 3600
format-prefix-foreground = ${colors.border_glow}
format-foreground = ${colors.text_white}
format-background = ${colors.bg_card}
format-padding = 2

; 1. Track Info (Artist - Title)
[module/media-info]
type = custom/script
tail = true
interval = 1
exec = playerctl metadata --format '{{ artist }} - {{ title }}' 2>/dev/null | cut -c 1-30 || echo "No Audio"
format-background = ${colors.bg_card}
format-foreground = ${colors.border_glow}
format-padding = 1

; 2. Previous Track Icon Button
[module/media-prev]
type = custom/text
content = " 󰒮 "
content-background = ${colors.bg_card}
content-foreground = ${colors.border_glow}
click-left = playerctl previous

; 3. Play / Pause Toggle Icon Button
[module/media-play]
type = custom/text
content = " 󰐊 "
content-background = ${colors.bg_card}
content-foreground = ${colors.border_glow}
click-left = playerctl play-pause

; 4. Next Track Icon Button
[module/media-next]
type = custom/text
content = " 󰒭 "
content-background = ${colors.bg_card}
content-foreground = ${colors.border_glow}
click-left = playerctl next

[module/date-left]
type = internal/date
interval = 60.0
date = "%d/%m/%Y"

; Long toggle view (on click)
date-alt = "%d/%m/%Y, day %j, week %V, %A %d %B of %Y"
label = " | %date% "
label-background = ${colors.bg_card}
label-foreground = ${colors.border_glow}

[module/window-title]
type = internal/xwindow
label = "%title:0:30:...%"
label-foreground = ${colors.border_cyan}
label-padding = 8
label-empty = ""

; =====================================================================
; Modules: Right
; =====================================================================

[module/ip-eth]
type = internal/network
interface = eno1
interval = 2.0

format-connected = <label-connected>
format-connected-background = ${colors.bg_card}
label-connected = " ⇣%downspeed:7% ⇡%upspeed:7% "
label-connected-foreground = ${colors.cyan_accent}

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.bg_card}
label-disconnected = "   Offline "
label-disconnected-foreground = ${colors.text_muted}

[module/cpu]
type = internal/cpu
interval = 2
format-background = ${colors.bg_card}
format-foreground = ${colors.text_white}
label = "   %percentage%% "

[module/memory]
type = internal/memory
interval = 3
format-background = ${colors.bg_card}
format-padding = 1
format-foreground = ${colors.border_glow}
label = "   %gb_used% "

[module/volume-percent]
type = internal/pulseaudio
use-ui-max = true
interval = 1

format-volume = <label-volume>
format-volume-background = ${colors.bg_card}
format-volume-padding = 1
label-volume = "   %percentage%% "
label-volume-foreground = ${colors.border_glow}

format-muted = <label-muted>
format-muted-background = ${colors.bg_card}
format-muted-padding = 1
label-muted = "   Muted "
label-muted-foreground = ${colors.alert_red}

[module/date]
type = internal/date
interval = 1.0

date = "%Y-%m-%d"
time = "%H:%M:%S %p"
date-alt = "%A, %b %d, %Y"
time-alt = "%H:%M:%S"

label = "  %time% "
;label-background = ${colors.border_glow}
;label-foreground = #0F051D
label-background = ${colors.bg_card}
label-foreground = ${colors.border_glow}

;[module/tray]
;type = internal/tray
;format-background = ${colors.bg_card}
;tray-padding = 1

[module/poweroff]
type = custom/menu
format-background = ${colors.transparent_blue}
format-foreground = ${colors.text_white}
expand-right = false

label-open = "  "
label-close = " Cancel "
label-close-foreground = ${colors.text_white}
label-separator = "|"
label-separator-foreground = ${colors.text_muted}

menu-0-0 = " Reboot "
menu-0-0-foreground = ${colors.text_white}
menu-0-0-exec = menu-open-1
menu-0-1 = " Power Off "
menu-0-1-foreground = ${colors.flash_orange}
menu-0-1-exec = menu-open-2

menu-1-0 = " Reboot "
menu-1-0-foreground = ${colors.flash_orange}
menu-1-0-exec = systemctl reboot
menu-1-1 = " Cancel "
menu-1-1-exec = menu-open-0

menu-2-0 = " Power Off "
menu-2-0-foreground = ${colors.flash_orange}
menu-2-0-exec = systemctl poweroff
menu-2-1 = " Cancel "
menu-2-1-exec = menu-open-0

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0
