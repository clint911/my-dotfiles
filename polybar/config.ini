;==========================================================
;
;   To learn more about how to configure Polybar
;   go to https://github.com/jaagr/polybar
;
;   The README contains alot of information
;
;=====================================================
; Windows XP "Luna" Theme for Polybar
; =====================================================================

[colors]
; Core Luna Theme Colors
base_blue       = #0055EA
top_bevel       = #3D91FF
start_green     = #388E3C
tray_blue       = #0972DA
active_task     = #0940A1
inactive_task   = #1C69E2
flash_orange    = #FF7B00
text_white      = #FFFFFF
text_muted      = #D0E0FF

[bar/main]
bottom = false
width = 100%
height = 20pt
radius = 0

background = ${colors.base_blue}
foreground = ${colors.text_white}

; Prevent right-side truncation
padding-left = 0
padding-right = 1

; Top 3D highlight line
border-top-size = 2pt
border-top-color = ${colors.top_bevel}

; Fonts
font-0 = "Tahoma:size=10:weight=bold;2"
font-1 = "DejaVu Sans:size=10;2"
font-2 = "JetBrainsMono Nerd Font:size=10;2"
font-3 = "FontAwesome:pixelsize=11;2"

; Layout structure
modules-left = start i3 year-progress date-left
modules-center = window-title
modules-right = ip-eth memory cpu brightness volume-percent time tray poweroff

wm-restack = i3
cursor-click = pointer

; =====================================================================
; Modules: Left & Center
; =====================================================================

[module/start]
type = custom/text
; Classic XP Start button with Windows flag icon
content = "  %{F#F25022}■%{F#7FBA00}■%{F#00A4EF}■%{F#FFB900}■%{F-} start  "
content-background = ${colors.start_green}
content-foreground = ${colors.text_white}
format-font = 1
click-left =  rofi -show drun -theme ~/.config/rofi/xp-start-menu.rasi

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = false

; Active Workspace (Sunken XP Task Button - Broadened)
label-focused = "  %name%  "
label-focused-background = ${colors.active_task}
label-focused-foreground = ${colors.text_white}
label-focused-padding = 4

; Inactive Workspaces (Raised XP Task Buttons - Broadened)
label-unfocused = "  %name%  "
label-unfocused-background = ${colors.inactive_task}
label-unfocused-foreground = ${colors.text_muted}
label-unfocused-padding = 4

; Urgent Workspaces
label-urgent = "  %name%  "
label-urgent-background = ${colors.flash_orange}
label-urgent-foreground = ${colors.text_white}
label-urgent-padding = 4

label-separator = " "
label-separator-background = ${colors.base_blue}

[module/year-progress]
type = custom/script
exec = ~/.config/polybar/scripts/year-progress.sh
interval = 3600
format-foreground = ${colors.text_white}
format-background = ${colors.base_blue}
format-padding = 1

 [module/date-left]
type = internal/date
interval = 60.0
; Uses standard strftime specifiers: %d = day, %m = month, %Y = year, %j = day of year, %V = week number
date = "%d/%m/%Y, day %j, week %V, %A %d %B of %Y"
label = " | %date% "
label-background = ${colors.base_blue}
label-foreground = ${colors.text_white}

[module/window-title]
type = internal/xwindow
label = "%title:0:30:...%"
label-background = ${colors.active_task}
label-foreground = ${colors.text_white}
label-padding = 2
label-empty = ""

; =====================================================================
; Modules: Right (XP Notification Area / System Tray)
; =====================================================================

[module/ip-eth]
type = internal/network
interface = eno1
interval = 2.0

format-connected = <label-connected>
format-connected-background = ${colors.tray_blue}
label-connected = "  ⇣%downspeed:7% ⇡%upspeed:7% "
label-connected-foreground = ${colors.text_white}

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.tray_blue}
label-disconnected = "  Off "
label-disconnected-foreground = ${colors.text_muted}

[module/cpu]
type = internal/cpu
interval = 2
format-background = ${colors.tray_blue}
format-foreground = ${colors.text_white}
label = "  %percentage%% "

[module/memory]
type = internal/memory
interval = 3
format-background = ${colors.tray_blue}
format-foreground = ${colors.text_white}
label = "  %gb_free% "

[module/volume-percent]
type = internal/pulseaudio
use-ui-max = true
interval = 1

format-volume = <label-volume>
format-volume-background = ${colors.tray_blue}
label-volume = "  󰕾 %percentage%% "
label-volume-foreground = ${colors.text_white}

format-muted = <label-muted>
format-muted-background = ${colors.tray_blue}
label-muted = "  Muted "
label-muted-foreground = ${colors.flash_orange}

[module/time]
type = internal/date
interval = 1.0
; Time with seconds in XP Tray format
date = "%I:%M:%S %p"
date-alt = "%A, %b %d, %Y"
label = " %date% "
label-background = ${colors.tray_blue}
label-foreground = ${colors.text_white}

[module/tray]
type = internal/tray
format-background = ${colors.tray_blue}
tray-padding = 1
tray-size = 65%

[module/poweroff]
type = custom/menu
format-background = ${colors.tray_blue}
format-foreground = ${colors.text_white}
expand-right = false

label-open = "  "
label-close = " Cancel "
label-close-foreground = ${colors.text_white}
label-separator = "|"
label-separator-foreground = ${colors.text_muted}

menu-0-0 = " Reboot "
menu-0-0-foreground = ${colors.text_white}
menu-0-0-exec = menu-open-1
menu-0-1 = " Power Off "
menu-0-1-foreground = ${colors.flash_orange}
menu-0-1-exec = menu-open-2

menu-1-0 = " Reboot "
menu-1-0-foreground = ${colors.flash_orange}
menu-1-0-exec = systemctl reboot
menu-1-1 = " Cancel "
menu-1-1-exec = menu-open-0

menu-2-0 = " Power Off "
menu-2-0-foreground = ${colors.flash_orange}
menu-2-0-exec = systemctl poweroff
menu-2-1 = " Cancel "
menu-2-1-exec = menu-open-0

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0
